<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Schedule | Europe 2026</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {
            --navy: #16324f;
            --navy-light: #244d70;
            --gold: #d4af37;
            --white: #ffffff;
            --dark-overlay: rgba(0, 0, 0, 0.64);
            --panel: rgba(0, 0, 0, 0.58);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Montserrat", sans-serif;
            background:
                linear-gradient(
                    var(--dark-overlay),
                    var(--dark-overlay)
                ),
                url("./Visuals/schedule.jpg")
                no-repeat center center fixed;
            background-size: cover;
            color: var(--white);
        }

        header {
            width: min(100% - 2rem, 950px);
            margin: 2rem auto 1.25rem;
            padding: 2rem 1rem;
            border: 1px solid rgba(212, 175, 55, 0.65);
            border-bottom: 3px solid var(--gold);
            border-radius: 16px;
            background: rgba(22, 50, 79, 0.88);
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        header h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            letter-spacing: 4px;
        }

        header p {
            margin: 0.5rem 0 0;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            width: min(100% - 2rem, 1200px);
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        .calendar-container {
            padding: 1rem;
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 16px;
            background: var(--panel);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .calendar-frame {
            width: 100%;
            height: 720px;
            display: block;
            border: none;
            border-radius: 10px;
            background: #ffffff;
        }

        .calendar-note {
            margin: 1rem 0 0;
            color: #eeeeee;
            font-size: 0.9rem;
            line-height: 1.6;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .nav-button {
            display: inline-block;
            min-width: 190px;
            padding: 0.9rem 1.25rem;
            border: 2px solid transparent;
            border-radius: 9px;
            background-color: var(--navy);
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 3px 9px rgba(0, 0, 0, 0.3);
            transition:
                background-color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .nav-button:hover,
        .nav-button:focus {
            background-color: var(--navy-light);
            border-color: var(--gold);
            transform: translateY(-2px);
            outline: none;
        }

        footer {
            padding: 1.25rem 1rem;
            border-top: 2px solid var(--gold);
            background: rgba(22, 50, 79, 0.9);
            text-align: center;
            color: #eeeeee;
        }

        footer p {
            margin: 0;
        }

        @media screen and (max-width: 700px) {
            body {
                background-attachment: scroll;
            }

            header,
            main {
                width: min(100% - 1rem, 1200px);
            }

            header {
                margin-top: 0.5rem;
            }

            .calendar-container {
                padding: 0.5rem;
            }

            .calendar-frame {
                height: 640px;
            }

            .nav-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TRIP CALENDAR</h1>
    <p>London · Paris · Portugal</p>
</header>

<main>
    <section class="calendar-container">
        <!--
            Replace the src value below with your Europe 2026
            Google Calendar embed URL.
        -->
        <iframe
            class="calendar-frame"
            title="Europe 2026 trip calendar"
            src="PASTE_YOUR_GOOGLE_CALENDAR_EMBED_URL_HERE"
            loading="lazy"
            scrolling="no">
        </iframe>

        <p class="calendar-note">
            The calendar displays the shared Europe 2026 itinerary.
            Changes made in Google Calendar will appear here automatically.
        </p>
    </section>

    <nav class="nav-buttons" aria-label="Page navigation">
        <a class="nav-button" href="countries.html">
            View Destinations
        </a>

        <a class="nav-button" href="index.html">
            Back to Home
        </a>
    </nav>
</main>

<footer>
    <p>Nanase &amp; Kevin · Europe 2026</p>
</footer>

</body>
</html>
